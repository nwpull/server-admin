server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/server_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid

jwt:
  secret: server-admin-jwt-secret-key-must-be-at-least-32-chars
  expiration: 86400000

encrypt:
  key: server-admin-encrypt-key-32
